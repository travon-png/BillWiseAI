services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billwise
      POSTGRES_PASSWORD: billwise
      POSTGRES_DB: billwise
    ports:
      - "5432:5432"
    volumes:
      - billwise_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billwise -d billwise"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  billwise_pg:
